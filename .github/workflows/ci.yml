name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install flake8
      - run: flake8 user_post_emulators/ --count --max-line-length=120 --statistics --ignore=W292,W293,W391,F841,E231,E305